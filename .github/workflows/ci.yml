name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Build
      run: bun run build

    - name: Test
      run: bun run test

    - name: Install browser engines
      run: bunx playwright install --with-deps chromium webkit

    - name: Browser regressions (Chromium)
      run: bun run test:browser

    - name: Browser regressions (WebKit)
      run: bun run test:browser
      env:
        SCROLL_BROWSER: webkit
        SCROLL_EVIDENCE_DIR: artifacts/browser-webkit

    - name: Preserve browser receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-regressions
        path: artifacts/
